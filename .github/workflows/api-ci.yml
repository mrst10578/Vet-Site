name: API CI

on:
  push:
    branches: ["main", "feat/petcare-phase1-foundation"]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npm run typecheck
      - name: Build API
        run: npm run build
