name: API CI

on:
  push:
    branches: ["main", "feat/petcare-phase1-foundation"]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npm run typecheck
      - name: Build API
        run: npm run build

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vettest
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: vettest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vettest -d vettest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vettest:temporary-ci-only@127.0.0.1:5432/vettest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Build integration script
        run: npm run build
      - name: Run access-control integration tests
        run: npm run integration
